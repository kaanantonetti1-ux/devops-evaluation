name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SEMVER: "1.0.0"

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine commit SHA
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            FULL_SHA="${{ github.sha }}"
          fi

          SHORT_SHA="${FULL_SHA::7}"

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SEMVER }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.short_sha }}

  deploy:
    name: Deploy
    needs:
      - build-and-push

    runs-on:
      - self-hosted
      - Windows
      - X64

    timeout-minutes: 15
    environment: production

    env:
      SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}

    steps:
      - name: Pull deployment image
        shell: powershell
        run: |
          docker pull "${env:IMAGE}:$env:SHORT_SHA"

      - name: Prepare Docker environment
        shell: powershell
        run: |
          $network = "devops-evaluation-net"
          $redis = "devops-redis-prod"

          $existingNetwork = docker network ls `
            --filter "name=^$network$" `
            --format "{{.Name}}"

          if (-not $existingNetwork) {
            docker network create $network | Out-Null
          }

          $existingRedis = docker ps -a `
            --filter "name=^/$redis$" `
            --format "{{.Names}}"

          if (-not $existingRedis) {
            docker run -d `
              --name $redis `
              --network $network `
              redis:7.4-alpine
          }
          else {
            docker start $redis 2>$null
          }

      - name: Deploy application
        shell: powershell
        run: |
          $app = "devops-app-prod"

          $existingApp = docker ps -a `
            --filter "name=^/$app$" `
            --format "{{.Names}}"

          if ($existingApp) {
            $previousImage = docker inspect `
              -f "{{.Config.Image}}" `
              $app

            "PREVIOUS_IMAGE=$previousImage" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

            docker rm -f $app
          }
          else {
            "PREVIOUS_IMAGE=" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append
          }

          $oldApp = docker ps -a `
            --filter "name=^/devops-app$" `
            --format "{{.Names}}"

          if ($oldApp) {
            docker rm -f devops-app
          }

          docker run -d `
            --name $app `
            --network devops-evaluation-net `
            -p 5000:5000 `
            -e REDIS_HOST=invalid-redis-host `
            -e REDIS_PORT=6379 `
            -e APP_VERSION=$env:SHORT_SHA `
            "${env:IMAGE}:$env:SHORT_SHA"

      - name: Verify deployment health
        shell: powershell
        run: |
          $healthy = $false

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Healthcheck attempt $attempt of 3"

            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:5000/health" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
              Write-Host "Healthcheck failed"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $healthy) {
            throw "Deployment healthcheck failed after 3 attempts."
          }

      - name: Roll back failed deployment
        if: ${{ failure() && env.PREVIOUS_IMAGE != '' }}
        shell: powershell
        run: |
          Write-Host "Rolling back to $env:PREVIOUS_IMAGE"

          docker pull "$env:PREVIOUS_IMAGE"

          docker rm -f devops-app-prod 2>$null

          docker run -d `
            --name devops-app-prod `
            --network devops-evaluation-net `
            -p 5000:5000 `
            -e REDIS_HOST=devops-redis-prod `
            -e REDIS_PORT=6379 `
            -e APP_VERSION=rollback `
            "$env:PREVIOUS_IMAGE"
