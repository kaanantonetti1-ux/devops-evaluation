groups:
  - name: devops-evaluation-alerts
    rules:
      - alert: HighHttp5xxErrorRate
        expr: |
          (
            sum(
              rate(
                http_requests_total{code=~"5.."}[5m]
              )
            )
            /
            sum(
              rate(
                http_requests_total[5m]
              )
            )
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: >-
            More than 5% of HTTP requests return 5xx responses
            for at least 2 minutes.

      - alert: HighHttpP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, route) (
              rate(
                http_request_duration_seconds_bucket[5m]
              )
            )
          ) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP p95 latency"
          description: >-
            The p95 HTTP request latency is above 500 ms
            for at least 3 minutes.
